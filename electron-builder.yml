appId: com.acadence.app
productName: Acadence

directories:
  output: release

files:
  - out/**/*

artifactName: "${productName}-Setup-${version}.${ext}"

npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Acadence
  uninstallDisplayName: Acadence
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
