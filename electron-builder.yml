appId: com.acadence.app
productName: Acadence

directories:
  output: release

files:
  - out/**/*

artifactName: '${productName}-${version}-${arch}.${ext}'

npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
    - target: msi
      arch:
        - x64
  publish:
    - provider: github
      owner: Alex-Zechariah-02
      repo: SWE40006-Task-1

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Acadence
  uninstallDisplayName: Acadence
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: Acadence
  deleteAppDataOnUninstall: false

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: Acadence
  shortcutName: Acadence
